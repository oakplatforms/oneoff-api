service: tcgx-api

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  versionFunctions: true
  architecture: arm64
  httpApi:
    payload: '2.0'
    authorizers:
      lambdaAuth:
        type: request
        functionName: authorizer

  environment:
    NODE_ENV: ${sls:stage}
    STAGE: ${sls:stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: arn:aws:events:us-east-1:*:event-bus/default
        - Effect: Allow
          Action:
            - states:StartExecution
          Resource: arn:aws:states:us-east-1:*:stateMachine:*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:GetObject
            - s3:DeleteObject
          Resource: 
            - arn:aws:s3:::${self:custom.s3Bucket.${sls:stage}}/*
            - arn:aws:s3:::${self:custom.s3Bucket.${sls:stage}}
        - Effect: Allow
          Action:
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminDeleteUser
            - cognito-idp:ListUsers
          Resource: 
            - arn:aws:cognito-idp:us-east-1:992382609315:userpool/${env:CONSUMER_USER_POOL_ID}
            - arn:aws:cognito-idp:us-east-1:992382609315:userpool/${env:ADMIN_USER_POOL_ID}
        - Effect: Allow
          Action:
            - rds-db:connect
          Resource: 
            - arn:aws:rds-db:us-east-1:${aws:accountId}:dbuser:${self:custom.rdsProxyName.${sls:stage}}/*

functions:
  api:
    name: tcgx-api-${sls:stage}
    handler: lambdas/apiHandler.handler
    memorySize: ${self:custom.memorySize.${sls:stage}}
    ephemeralStorageSize: ${self:custom.storageSize.${sls:stage}}
    layers:
      - arn:aws:lambda:us-east-1:992382609315:layer:sharp-arm64:1
    events:
      - httpApi:
          path: /{proxy+}
          method: GET
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: POST
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: PUT
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: DELETE
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: OPTIONS
    provisionedConcurrency: ${self:custom.provisionedConcurrency.${sls:stage}}
    environment:
      DATABASE_URL: ${env:DATABASE_URL}
      RDS_PROXY_ENDPOINT: !GetAtt RDSProxyEndpoint.Endpoint
      S3_BUCKET_NAME: ${self:custom.s3Bucket.${sls:stage}}
      STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET}
      SHIPPO_SECRET_KEY: ${env:SHIPPO_SECRET_KEY}
      SHIPPO_WEBHOOK_SECRET: ${env:SHIPPO_WEBHOOK_SECRET}
      SHIPPO_CARRIER_ACCOUNT_USPS: ${env:SHIPPO_CARRIER_ACCOUNT_USPS}
      SHIPPO_CARRIER_ACCOUNT_UPS: ${env:SHIPPO_CARRIER_ACCOUNT_UPS}
      SHIPPO_CARRIER_ACCOUNT_FEDEX: ${env:SHIPPO_CARRIER_ACCOUNT_FEDEX}
      SHIPPO_CARRIER_ACCOUNT_DHL: ${env:SHIPPO_CARRIER_ACCOUNT_DHL}
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
      PRICING_ENGINE_ARN: ${env:PRICING_ENGINE_ARN}

  authorizer:
    name: tcgx-api-authorizer-${sls:stage}
    handler: lambdas/authorizerHandler.handler
    environment:
      ADMIN_USER_POOL_ID: ${env:ADMIN_USER_POOL_ID}
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
      TEMP_JWT_SECRET: ${env:TEMP_JWT_SECRET}

  guestToken:
    name: tcgx-api-guest-token-${sls:stage}
    handler: lambdas/guestTokenHandler.handler
    environment:
      TEMP_JWT_SECRET: ${env:TEMP_JWT_SECRET}
    events:
      - httpApi:
          path: /user/guest-token
          method: GET

  stripeWebhook:
    name: tcgx-api-stripe-webhook-${sls:stage}
    handler: lambdas/stripeWebhookHandler.handler
    environment:
      DATABASE_URL: ${env:DATABASE_URL}
      RDS_PROXY_ENDPOINT: !GetAtt RDSProxyEndpoint.Endpoint
      STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET}
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
    events:
      - httpApi:
          path: /webhook/stripe
          method: POST

  shippoWebhook:
    name: tcgx-api-shippo-webhook-${sls:stage}
    handler: lambdas/shippoWebhookHandler.handler
    environment:
      DATABASE_URL: ${env:DATABASE_URL}
      RDS_PROXY_ENDPOINT: !GetAtt RDSProxyEndpoint.Endpoint
      SHIPPO_SECRET_KEY: ${env:SHIPPO_SECRET_KEY}
      SHIPPO_WEBHOOK_SECRET: ${env:SHIPPO_WEBHOOK_SECRET}
    events:
      - httpApi:
          path: /webhook/shippo
          method: POST

custom:
  dotenv:
    path: .env.${opt:stage, 'dev'}
    logging: false
  
  isProd: ${opt:stage, 'dev'} == 'prod'
  
  s3Bucket:
    dev: tcgx-dev
    stage: tcgx-stage
    prod: tcgx-prod
  
  rdsProxyName:
    dev: tcgx-dev-proxy
    stage: tcgx-stage-proxy
    prod: tcgx-prod-proxy
  
  provisionedConcurrency:
    dev: 0
    stage: 0
    prod: 3
  
  memorySize:
    dev: 1024
    stage: 1024
    prod: 2048
  
  storageSize:
    dev: 512
    stage: 512
    prod: 1024
  
  logLevel:
    dev: debug
    stage: info
    prod: warn
  
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    concurrency: 10
    exclude:
      - '@prisma/client'
      - sharp

resources:
  Resources:
    RDSProxy:
      Type: AWS::RDS::DBProxy
      Properties:
        DBProxyName: ${self:custom.rdsProxyName.${sls:stage}}
        EngineFamily: POSTGRESQL
        Auth:
          - AuthScheme: SECRETS
            SecretArn: ${env:RDS_SECRET_ARN}
            IAMAuth: DISABLED
        RoleArn: !GetAtt RDSProxyRole.Arn
        TargetGroups:
          - DBInstanceIdentifiers:
              - ${env:RDS_INSTANCE_IDENTIFIER}
        VpcSubnetIds:
          - ${env:SUBNET_ID_1}
          - ${env:SUBNET_ID_2}
        RequireTLS: true
        IdleClientTimeout: 1800
        MaxConnectionsPercent: 100

    RDSProxyRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-rds-proxy-role
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: rds.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: RDSProxyPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                    - secretsmanager:DescribeSecret
                  Resource: ${env:RDS_SECRET_ARN}
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                  Resource: '*'
                  Condition:
                    StringEquals:
                      kms:ViaService: secretsmanager.${aws:region}.amazonaws.com

    RDSProxyEndpoint:
      Type: AWS::RDS::DBProxyEndpoint
      Properties:
        DBProxyName: !Ref RDSProxy
        DBProxyEndpointName: ${self:custom.rdsProxyName.${sls:stage}}-endpoint
        VpcSubnetIds:
          - ${env:SUBNET_ID_1}
          - ${env:SUBNET_ID_2}
        VpcSecurityGroupIds:
          - ${env:RDS_SECURITY_GROUP_ID}
        TargetRole: READ_WRITE

package:
  individually: true
  patterns:
    - node_modules/@prisma/client/**
    - node_modules/.prisma/client/**
    - certs/**
    - '!**/*.test.ts'