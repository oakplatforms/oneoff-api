service: oneoff-api

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  versionFunctions: true
  architecture: arm64
  httpApi:
    payload: '2.0'
    authorizers:
      lambdaAuth:
        type: request
        functionName: authorizer

  environment:
    STAGE: ${sls:stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: arn:aws:events:us-east-1:*:event-bus/default
        - Effect: Allow
          Action:
            - states:StartExecution
          Resource: arn:aws:states:us-east-1:*:stateMachine:*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${self:custom.s3Bucket.${sls:stage}}/*
            - arn:aws:s3:::${self:custom.s3Bucket.${sls:stage}}
        - Effect: Allow
          Action:
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminDeleteUser
            - cognito-idp:ListUsers
          Resource:
            - arn:aws:cognito-idp:us-east-1:992382609315:userpool/${env:CONSUMER_USER_POOL_ID}
            - arn:aws:cognito-idp:us-east-1:992382609315:userpool/${env:ADMIN_USER_POOL_ID}
        - Effect: Allow
          Action:
            - rekognition:DetectText
          Resource: '*'
        - Effect: Allow
          Action:
            - mediaconvert:CreateJob
            - mediaconvert:GetJob
            - mediaconvert:DescribeEndpoints
          Resource: '*'
        - Effect: Allow
          Action:
            - iam:PassRole
          Resource:
            - arn:aws:iam::992382609315:role/MediaConvertRole
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:us-east-1:992382609315:secret:oneoff-credentials-*

functions:
  api:
    name: oneoff-api-${sls:stage}
    handler: lambdas/apiHandler.handler
    memorySize: ${self:custom.memorySize.${sls:stage}}
    ephemeralStorageSize: ${self:custom.storageSize.${sls:stage}}
    layers:
      - arn:aws:lambda:us-east-1:992382609315:layer:sharp-arm64:1
    events:
      - httpApi:
          path: /{proxy+}
          method: GET
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: POST
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: PUT
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: DELETE
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: OPTIONS
    provisionedConcurrency: ${self:custom.provisionedConcurrency.${sls:stage}}
    environment:
      S3_BUCKET_NAME: ${self:custom.s3Bucket.${sls:stage}}
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
      ADMIN_USER_POOL_ID: ${env:ADMIN_USER_POOL_ID}

  authorizer:
    name: oneoff-api-authorizer-${sls:stage}
    handler: lambdas/authorizerHandler.handler
    environment:
      ADMIN_USER_POOL_ID: ${env:ADMIN_USER_POOL_ID}
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}

  guestToken:
    name: oneoff-api-guest-token-${sls:stage}
    handler: lambdas/guestTokenHandler.handler
    events:
      - httpApi:
          path: /user/guest-token
          method: GET

  stripeWebhook:
    name: oneoff-api-stripe-webhook-${sls:stage}
    handler: lambdas/stripeWebhookHandler.handler
    events:
      - httpApi:
          path: /webhook/stripe
          method: POST

  videoProcessor:
    name: oneoff-api-video-processor-${sls:stage}
    handler: lambdas/videoProcessorHandler.handler
    memorySize: 1024
    timeout: 120
    ephemeralStorageSize: 1024
    environment:
      S3_BUCKET_NAME: ${self:custom.s3Bucket.${sls:stage}}
      MEDIA_CONVERT_ROLE_ARN: arn:aws:iam::992382609315:role/MediaConvertRole
    events:
      - s3:
          bucket: ${self:custom.s3Bucket.${sls:stage}}
          event: s3:ObjectCreated:*
          rules:
            - prefix: video/
          existing: true

  videoComplete:
    name: oneoff-api-video-complete-${sls:stage}
    handler: lambdas/videoCompleteHandler.handler
    memorySize: 256
    timeout: 30
    environment:
      S3_BUCKET_NAME: ${self:custom.s3Bucket.${sls:stage}}
    events:
      - eventBridge:
          pattern:
            source:
              - aws.mediaconvert
            detail-type:
              - MediaConvert Job State Change
            detail:
              status:
                - COMPLETE
                - ERROR

custom:
  dotenv:
    path: .env.${opt:stage, 'dev'}
    logging: false

  s3Bucket:
    dev: oneoff-static-dev
    stage: oneoff-static-stage
    prod: oneoff-static-prod

  provisionedConcurrency:
    dev: 0
    stage: 0
    prod: 3

  memorySize:
    dev: 1024
    stage: 1024
    prod: 3072

  storageSize:
    dev: 512
    stage: 512
    prod: 1024

  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    concurrency: 10
    exclude:
      - '@prisma/client'
      - sharp

package:
  individually: true
  patterns:
    - node_modules/@prisma/client/**
    - node_modules/@prisma/client-runtime-utils/**
    - node_modules/.prisma/client/**
    - certs/**
    - '!**/*.test.ts'
