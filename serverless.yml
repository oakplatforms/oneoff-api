service: oneoff-api

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  versionFunctions: true
  architecture: arm64
  httpApi:
    payload: '2.0'
    authorizers:
      lambdaAuth:
        type: request
        functionName: authorizer

  environment:
    NODE_ENV: ${sls:stage}
    STAGE: ${sls:stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: arn:aws:events:us-east-1:*:event-bus/default
        - Effect: Allow
          Action:
            - states:StartExecution
          Resource: arn:aws:states:us-east-1:*:stateMachine:*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:GetObject
            - s3:DeleteObject
          Resource: 
            - arn:aws:s3:::oneoff-dev/*
            - arn:aws:s3:::oneoff-dev
        - Effect: Allow
          Action:
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminDeleteUser
            - cognito-idp:ListUsers
          Resource: 
            - arn:aws:cognito-idp:us-east-1:992382609315:userpool/${env:CONSUMER_USER_POOL_ID}
        - Effect: Allow
          Action:
            - rekognition:DetectText
          Resource: '*'

functions:
  api:
    name: oneoff-api-${sls:stage}
    handler: lambdas/apiHandler.handler
    memorySize: 1024
    ephemeralStorageSize: 512
    layers:
      - arn:aws:lambda:us-east-1:992382609315:layer:sharp-arm64:1
    events:
      - httpApi:
          path: /{proxy+}
          method: GET
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: POST
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: PUT
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: DELETE
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: OPTIONS
    provisionedConcurrency: 0
    environment:
      DATABASE_URL: ${env:DATABASE_URL}
      S3_BUCKET_NAME: oneoff-dev
      STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET}
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}

  authorizer:
    name: oneoff-api-authorizer-${sls:stage}
    handler: lambdas/authorizerHandler.handler
    environment:
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
      TEMP_JWT_SECRET: ${env:TEMP_JWT_SECRET}

  guestToken:
    name: oneoff-api-guest-token-${sls:stage}
    handler: lambdas/guestTokenHandler.handler
    environment:
      TEMP_JWT_SECRET: ${env:TEMP_JWT_SECRET}
    events:
      - httpApi:
          path: /user/guest-token
          method: GET

  stripeWebhook:
    name: oneoff-api-stripe-webhook-${sls:stage}
    handler: lambdas/stripeWebhookHandler.handler
    environment:
      DATABASE_URL: ${env:DATABASE_URL}
      STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET}
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
    events:
      - httpApi:
          path: /webhook/stripe
          method: POST

custom:
  dotenv:
    path: .env.${opt:stage, 'dev'}
    logging: false

  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    concurrency: 10
    exclude:
      - '@prisma/client'
      - sharp

package:
  individually: true
  patterns:
    - node_modules/@prisma/client/**
    - node_modules/@prisma/client-runtime-utils/**
    - node_modules/.prisma/client/**
    - certs/**
    - '!**/*.test.ts'
