service: tcgx-api

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  versionFunctions: true
  architecture: arm64
  httpApi:
    payload: '2.0'
    authorizers:
      lambdaAuth:
        type: request
        functionName: authorizer

  environment:
    NODE_ENV: ${sls:stage}
    STAGE: ${sls:stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: arn:aws:events:us-east-1:*:event-bus/default
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:GetObject
            - s3:DeleteObject
          Resource: 
            - arn:aws:s3:::${self:custom.s3Bucket.${sls:stage}}/*
            - arn:aws:s3:::${self:custom.s3Bucket.${sls:stage}}
        - Effect: Allow
          Action:
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
          Resource: 
            - arn:aws:cognito-idp:us-east-1:992382609315:userpool/${env:CONSUMER_USER_POOL_ID}
            - arn:aws:cognito-idp:us-east-1:992382609315:userpool/${env:ADMIN_USER_POOL_ID}

functions:
  api:
    name: tcgx-api-${sls:stage}
    handler: lambdas/apiHandler.handler
    layers:
      - arn:aws:lambda:us-east-1:992382609315:layer:sharp-arm64:1
    events:
      - httpApi:
          path: /{proxy+}
          method: GET
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: POST
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: PUT
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: DELETE
          authorizer: lambdaAuth
      - httpApi:
          path: /{proxy+}
          method: OPTIONS
    provisionedConcurrency: ${self:custom.provisionedConcurrency.${sls:stage}}
    environment:
      DATABASE_URL: ${env:DATABASE_URL}
      S3_BUCKET_NAME: ${self:custom.s3Bucket.${sls:stage}}
      STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET}
      SHIPPO_SECRET_KEY: ${env:SHIPPO_SECRET_KEY}
      SHIPPO_WEBHOOK_SECRET: ${env:SHIPPO_WEBHOOK_SECRET}
      SHIPPO_CARRIER_ACCOUNT_USPS: ${env:SHIPPO_CARRIER_ACCOUNT_USPS}
      SHIPPO_CARRIER_ACCOUNT_UPS: ${env:SHIPPO_CARRIER_ACCOUNT_UPS}
      SHIPPO_CARRIER_ACCOUNT_FEDEX: ${env:SHIPPO_CARRIER_ACCOUNT_FEDEX}
      SHIPPO_CARRIER_ACCOUNT_DHL: ${env:SHIPPO_CARRIER_ACCOUNT_DHL}
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}

  authorizer:
    name: tcgx-api-authorizer-${sls:stage}
    handler: lambdas/authorizerHandler.handler
    environment:
      ADMIN_USER_POOL_ID: ${env:ADMIN_USER_POOL_ID}
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
      TEMP_JWT_SECRET: ${env:TEMP_JWT_SECRET}

  guestToken:
    name: tcgx-api-guest-token-${sls:stage}
    handler: lambdas/guestTokenHandler.handler
    environment:
      TEMP_JWT_SECRET: ${env:TEMP_JWT_SECRET}
    events:
      - httpApi:
          path: /user/guest-token
          method: GET

  stripeWebhook:
    name: tcgx-api-stripe-webhook-${sls:stage}
    handler: lambdas/stripeWebhookHandler.handler
    environment:
      DATABASE_URL: ${env:DATABASE_URL}
      STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET}
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
    events:
      - httpApi:
          path: /webhook/stripe
          method: POST

  shippoWebhook:
    name: tcgx-api-shippo-webhook-${sls:stage}
    handler: lambdas/shippoWebhookHandler.handler
    environment:
      DATABASE_URL: ${env:DATABASE_URL}
      SHIPPO_SECRET_KEY: ${env:SHIPPO_SECRET_KEY}
      SHIPPO_WEBHOOK_SECRET: ${env:SHIPPO_WEBHOOK_SECRET}
    events:
      - httpApi:
          path: /webhook/shippo
          method: POST

custom:
  dotenv:
    path: .env.${opt:stage, 'dev'}
    logging: false
  
  isProd: ${opt:stage, 'dev'} == 'prod'
  
  s3Bucket:
    dev: tcgx-dev
    stage: tcgx-stage
    prod: tcgx-prod
  
  provisionedConcurrency:
    dev: 0
    stage: 0
    prod: 2
  
  logLevel:
    dev: debug
    stage: info
    prod: warn
  
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    concurrency: 10
    exclude:
      - '@prisma/client'
      - sharp

package:
  individually: true
  patterns:
    - node_modules/@prisma/client/**
    - node_modules/.prisma/client/**
    - '!node_modules/.prisma/client/libquery_engine-*'
    - 'node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node'
    - '!**/*.test.ts'