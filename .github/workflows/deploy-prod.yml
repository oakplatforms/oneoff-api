name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: npx prisma generate
    
    - name: Run tests
      run: npm test
    
    - name: Setup AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Install Serverless Framework
      run: npm install -g serverless
    
    - name: Deploy to Production
      run: serverless deploy --stage prod --verbose --disable-telemetry
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }}
        SHIPPO_SECRET_KEY: ${{ secrets.SHIPPO_SECRET_KEY_PROD }}
        SHIPPO_WEBHOOK_SECRET: ${{ secrets.SHIPPO_WEBHOOK_SECRET_PROD }}
        SHIPPO_CARRIER_ACCOUNT_USPS: ${{ secrets.SHIPPO_CARRIER_ACCOUNT_USPS_PROD }}
        SHIPPO_CARRIER_ACCOUNT_UPS: ${{ secrets.SHIPPO_CARRIER_ACCOUNT_UPS_PROD }}
        SHIPPO_CARRIER_ACCOUNT_FEDEX: ${{ secrets.SHIPPO_CARRIER_ACCOUNT_FEDEX_PROD }}
        SHIPPO_CARRIER_ACCOUNT_DHL: ${{ secrets.SHIPPO_CARRIER_ACCOUNT_DHL_PROD }}
        # Disable Serverless Dashboard authentication
        SLS_ORG: ""
        SLS_APP: ""
        SERVERLESS_ACCESS_KEY: "" 