name: Deploy to Dev

on:
  push:
    branches: [ dev ]

# Required for OIDC token generation and package publishing
permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SLS_DISABLE_DASHBOARD: "true"
      SLS_TELEMETRY_DISABLED: "true"
      SLS_ORG: ""
      SLS_APP: ""

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@oakplatforms'

    - name: Install dependencies
      run: npm ci

    # OIDC-based AWS authentication (no access keys needed)
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
        aws-region: us-east-1

    - name: Get database credentials from Secrets Manager
      id: db-secret
      run: |
        SECRET=$(aws secretsmanager get-secret-value --secret-id oneoff-credentials-dev --query SecretString --output text)
        USERNAME=$(echo $SECRET | jq -r '.username')
        PASSWORD=$(echo $SECRET | jq -r '.password')
        HOST=$(echo $SECRET | jq -r '.host')
        PORT=$(echo $SECRET | jq -r '.port')
        echo "DATABASE_URL=postgresql://${USERNAME}:${PASSWORD}@${HOST}:${PORT}/postgres?sslmode=require" >> $GITHUB_OUTPUT

    - name: Deploy Prisma migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ steps.db-secret.outputs.DATABASE_URL }}

    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ steps.db-secret.outputs.DATABASE_URL }}

    # Publish @oakplatforms/oneoff-types if schema or types package changed
    - name: Check for types changes
      id: types-check
      run: |
        if git diff --name-only HEAD~1 HEAD | grep -qE '^(prisma/schema\.prisma|packages/types/)'; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Install types package dependencies
      if: steps.types-check.outputs.changed == 'true'
      working-directory: packages/types
      run: npm install

    - name: Generate and build types
      if: steps.types-check.outputs.changed == 'true'
      working-directory: packages/types
      run: npm run generate && npm run build

    - name: Auto-bump types version and publish
      if: steps.types-check.outputs.changed == 'true'
      working-directory: packages/types
      run: |
        LATEST=$(npm view @oakplatforms/oneoff-types version 2>/dev/null || echo "0.0.0")
        npm version "$LATEST" --no-git-tag-version --allow-same-version
        npm version patch --no-git-tag-version
        npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Serverless Framework
      run: npm install -g serverless

    - name: Configure Serverless Framework
      run: |
        mkdir -p ~/.serverless
        echo '{"frameworkVersion": "3", "telemetryDisabled": true, "dashboard": {"enabled": false}}' > ~/.serverless/config.json

    - name: Deploy to Dev
      run: serverless deploy --stage dev --verbose
      env:
        ADMIN_USER_POOL_ID: ${{ vars.ADMIN_USER_POOL_ID_DEV }}
        CONSUMER_USER_POOL_ID: ${{ vars.CONSUMER_USER_POOL_ID_DEV }}
