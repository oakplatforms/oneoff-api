service: tcgx-api-swagger

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  httpApi:
    payload: '2.0'

  # Environment variables for all functions
  environment:
    NODE_ENV: ${sls:stage}
    STAGE: ${sls:stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: arn:aws:events:us-east-1:*:event-bus/default

functions:
  swagger:
    name: tcgx-api-swagger-docs-${sls:stage}
    handler: lambda/swaggerHandler.handler
    events:
      - httpApi:
          path: /swagger-ui/{proxy+}
          method: ANY
      - httpApi:
          path: /open-api
          method: GET
    package:
      individually: true
      patterns:
        - lambda/swaggerHandler.ts
        - src/routers/**
        - node_modules/swagger-ui-express/**
        - node_modules/swagger-jsdoc/**
        - '!**/*.test.ts'
        - '!node_modules/@prisma/client/**'
        - '!node_modules/.prisma/**'
        - '!node_modules/sharp/**'

custom:
  dotenv:
    path: .env.${opt:stage, 'dev'}
    logging: false
  
  isProd: ${opt:stage, 'dev'} == 'prod'
  
  s3Bucket:
    dev: tcgx-dev
    stage: tcgx-stage
    prod: tcgx-prod

  logLevel:
    dev: debug
    stage: info
    prod: warn
  
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    concurrency: 10
    exclude:
      - '@prisma/client'
      - sharp

package:
  individually: true
  patterns:
    - node_modules/@prisma/client/**
    - node_modules/.prisma/client/**
    - '!node_modules/.prisma/client/libquery_engine-*'
    - 'node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node'
    - '!**/*.test.ts' 